<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Resultados</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #333; margin-bottom: 20px; }
        #lista-texto { margin-top: 20px; text-align: left; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>📊 Resultados en Vivo</h1>
        <canvas id="graficoVotos"></canvas>
        <div id="lista-texto"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // IMPORTANTE: Pega aquí abajo TU PROPIO firebaseConfig (el que tienes en index.html)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            databaseURL: "https://TU_PROYECTO.firebaseio.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const votosRef = ref(db, 'votos');
        let miGrafico;

        onValue(votosRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const etiquetas = Object.keys(data);
                const valores = Object.values(data);

                // Actualizar lista de texto
                const listaDiv = document.getElementById('lista-texto');
                listaDiv.innerHTML = "<strong>Detalle:</strong>";
                etiquetas.forEach(bebida => {
                    listaDiv.innerHTML += `<p>${bebida}: ${data[bebida]} votos</p>`;
                });

                // Dibujar/Actualizar Gráfico
                const ctx = document.getElementById('graficoVotos').getContext('2d');
                if (miGrafico) { miGrafico.destroy(); }
                
                miGrafico = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: etiquetas,
                        datasets: [{
                            data: valores,
                            backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40']
                        }]
                    },
                    options: { responsive: true }
                });
            }
        });
    </script>
</body>
</html>
