<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Encuesta — Bebida Favorita</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface2: #1e1e1e;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #6b6b6b;
      --cola: #e63946;
      --agua: #4cc9f0;
      --cafe: #c77dff;
      --ninguna: #f4a261;
      --radius: 16px;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
    }
    /* subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.6s ease both;
      position: relative;
      z-index: 1;
    }
    header .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.7rem;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, #666);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .admin-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 1.2rem;
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 5px 14px;
      transition: color 0.2s, border-color 0.2s;
    }
    .admin-link:hover { color: #aaa; border-color: #444; }
    .panel {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
    }
    .question {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      margin-bottom: 1.6rem;
      line-height: 1.35;
    }
    .field { margin-bottom: 1.6rem; }
    .field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .field input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 0.78rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #555; }
    .options { display: flex; flex-direction: column; gap: 11px; margin-bottom: 2rem; }
    .option-label {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      user-select: none;
    }
    .option-label:hover { border-color: #444; background: #222; }
    input[type="radio"] { display: none; }
    input[type="radio"]:checked + .option-label.cola    { border-color: var(--cola);    background: #e6394612; }
    input[type="radio"]:checked + .option-label.agua    { border-color: var(--agua);    background: #4cc9f012; }
    input[type="radio"]:checked + .option-label.cafe    { border-color: var(--cafe);    background: #c77dff12; }
    input[type="radio"]:checked + .option-label.ninguna { border-color: var(--ninguna); background: #f4a26112; }
    .option-icon { font-size: 1.55rem; }
    .option-text { font-size: 0.95rem; font-weight: 500; }
    .btn {
      width: 100%;
      padding: 0.9rem;
      background: #fff;
      color: #000;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    /* Success state */
    .success-msg {
      display: none;
      text-align: center;
      padding: 1rem 0 0.5rem;
      animation: fadeUp 0.4s ease both;
    }
    .success-msg .icon { font-size: 3.2rem; margin-bottom: 0.8rem; }
    .success-msg h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .success-msg p { color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
    .btn-again {
      margin-top: 1.4rem;
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      padding: 0.6rem 1.6rem;
      border-radius: 100px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .btn-again:hover { border-color: #555; }
    .results-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 0.8rem;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 5px 14px;
      margin-left: 8px;
      transition: color 0.2s, border-color 0.2s;
    }
    .results-link:hover { color: #aaa; border-color: #444; }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<header>
  <p class="eyebrow">Encuesta rápida</p>
  <h1>¿Cuál es tu<br>bebida favorita?</h1>

</header>

<div class="panel">
  <div class="card">
    <!-- Formulario -->
    <div id="form-section">
      <p class="question">Selecciona tu bebida favorita</p>
      <div class="field">
        <label>Tu nombre <span style="color:#e63946">*</span></label>
        <input type="text" id="nombre" placeholder="Ej. Ana García"/>
      </div>
      <div class="options">
        <input type="radio" name="bebida" id="cola" value="Coca Cola"/>
        <label for="cola" class="option-label cola">
          <span class="option-icon">🥤</span>
          <span class="option-text">Coca Cola</span>
        </label>
        <input type="radio" name="bebida" id="agua" value="Agua"/>
        <label for="agua" class="option-label agua">
          <span class="option-icon">💧</span>
          <span class="option-text">Agua</span>
        </label>
        <input type="radio" name="bebida" id="cafe" value="Café"/>
        <label for="cafe" class="option-label cafe">
          <span class="option-icon">☕</span>
          <span class="option-text">Café</span>
        </label>
        <input type="radio" name="bebida" id="ninguna" value="Ninguna"/>
        <label for="ninguna" class="option-label ninguna">
          <span class="option-icon">🚫</span>
          <span class="option-text">Ninguna</span>
        </label>
      </div>
      <button class="btn" onclick="enviar()">Enviar respuesta →</button>
    </div>

    <!-- Éxito -->
<div class="success-msg" id="success-section" style="display:none;">
    <div class="icon">🎉</div>
    <h2>¡Gracias por votar!</h2>
    <p>Tu respuesta fue registrada correctamente.</p>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<h3>Resultados en tiempo real:</h3>
<div id="lista-resultados" style="text-align: left; margin: 10px 0;"></div>

<div style="max-width: 280px; margin: 15px auto;">
    <canvas id="graficoVotos"></canvas>
</div>
    
    <button class="btn-again" onclick="otroVoto()">Votar de nuevo</button>
</div>
    </div>
  </div>
</div>

<script type="module">
  // 1. Importaciones de Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // 2. Tus credenciales (las que sacaste de la imagen)
  const firebaseConfig = {
    apiKey: "AIzaSyC18BSvHNd7hL9AqSShWgauSwr72cL8qxY",
    authDomain: "encuesta-realtime.firebaseapp.com",
    databaseURL: "https://encuesta-realtime-default-rtdb.firebaseio.com", 
    projectId: "encuesta-realtime",
    storageBucket: "encuesta-realtime.firebasestorage.app",
    messagingSenderId: "971944797546",
    appId: "1:971944797546:web:90413ed2d496036818f113",
    measurementId: "G-7BT0MK26EM"
  };

  // 3. Inicialización
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 4. La nueva función enviar (ahora usa window.enviar para que el botón la encuentre)
  window.enviar = function() {
    const nombre = document.getElementById('nombre').value.trim();
    const bebida = document.querySelector('input[name="bebida"]:checked');
    
    if (!nombre) { alert('Por favor ingresa tu nombre.'); return; }
    if (!bebida) { alert('Por favor selecciona una bebida.'); return; }

    const bebidaRef = ref(db, 'votos/' + bebida.value);

    runTransaction(bebidaRef, (currentCount) => {
      return (currentCount || 0) + 1;
    }).then(() => {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'block';
    }).catch((error) => {
      console.error(error);
      alert("Error. Revisa que la base de datos esté en 'Modo de prueba'.");
    });
  };

  // 5. Función para votar de nuevo
  window.otroVoto = function() {
    document.getElementById('nombre').value = '';
    document.querySelectorAll('input[name="bebida"]').forEach(r => r.checked = false);
    document.getElementById('form-section').style.display = 'block';
    document.getElementById('success-section').style.display = 'none';
  };
  let miGrafico; 
const votosRef = ref(db, 'votos');

onValue(votosRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
        const etiquetas = Object.keys(data); 
        const valores = Object.values(data);

        const listaDiv = document.getElementById('lista-resultados');
        listaDiv.innerHTML = "";
        etiquetas.forEach(bebida => {
            listaDiv.innerHTML += `<p><strong>${bebida}:</strong> ${data[bebida]} votos</p>`;
        });

        const ctx = document.getElementById('graficoVotos').getContext('2d');
        if (miGrafico) { miGrafico.destroy(); } 

        miGrafico = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: etiquetas,
                datasets: [{
                    data: valores,
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'],
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    }
});
</script>
</body>
</html>
